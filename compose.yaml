# 红果短剧网页版 —— Docker Compose 部署
#
# 用法（二选一）：
#   1) 用现成镜像（默认）： docker compose up -d
#   2) 从源码构建：把下面 image: 一行注释掉，取消 build: 的注释，然后 docker compose up -d --build
#
# 所有配置都直接写在本文件里，改完执行 docker compose up -d 生效。
# 常用命令： docker compose logs -f   /   docker compose down（保留数据）

services:
  hongguo-web:
    image: ghcr.io/kid941005/hongguo-web:latest
    # build: .
    container_name: hongguo-web

    ports:
      # 宿主机端口:容器端口。左边是浏览器访问的端口，改这里即可（如 "9000:8787"）
      - "8787:8787"

    environment:
      # ---------- 基础 ----------
      PORT: "8787"                         # 容器内监听端口，改了要和上面 ports 右边保持一致
      HOST: "0.0.0.0"                      # 监听地址，容器内固定 0.0.0.0 才能被映射出去
      DATA_DIR: "/app/data"                # 配置 + 导入的 JS 源 + 缓存（必须可写，已挂卷）
      SOURCES_DIR: "/app/sources/builtin"  # 内置源目录（镜像自带，只读即可）
      TZ: "Asia/Shanghai"                  # 时区，日志时间用

      # ---------- 访问控制 ----------
      # 填了口令则所有 /api/* 需带 Authorization: Bearer <TOKEN> 或 ?token=<TOKEN>；
      # 浏览器首次打开 http://<host>:8787/?token=<TOKEN> 一次，前端会记住，并自动给媒体/流地址追加 token。留空=不校验。
      TOKEN: ""

      # ---------- 播放 / 安全 ----------
      MAX_STREAMS: "6"                     # 内置红果解密流的最大并发数
      ALLOW_PRIVATE_MEDIA: "0"             # 1=允许 /api/media、/api/hls 代理内网地址（默认 0 拒绝，防 SSRF）
      ALLOW_PRIVATE_FETCH: "0"             # 1=允许 JS 源 fetch 与按 URL 导入源访问内网地址（默认 0 拒绝，防 SSRF）

      # ---------- 源自动更新 ----------
      SOURCE_AUTO_UPDATE: "1"              # 1=启动后自动检查 JS 源上游更新；0=关闭
      SOURCE_UPDATE_INTERVAL_HOURS: "6"    # 自动检查间隔（小时）
      SOURCE_UPDATE_START_DELAY_SECONDS: "15"  # 启动后首次检查延迟（秒）

    volumes:
      - hongguo-data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/health').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---------- 安全加固（容器内只允许写挂载卷与 /tmp） ----------
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hongguo-data:
